<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Fira Code', monospace; background: #000; overflow: hidden; }
  three-d-stage:not(:defined) { visibility: hidden; }
  
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
  }
  
  .bio-panel {
    background: rgba(0, 10, 0, 0.85);
    border: 1px solid #00ff41;
    box-shadow: 0 0 25px rgba(0,255,65,0.2);
    padding: 40px;
    width: 100%;
    max-width: 450px;
    backdrop-filter: blur(8px);
    pointer-events: auto;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  
  .bio-panel::before {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #00ff41;
  }

  h1 { color: #00ff41; font-size: 28px; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px #00ff41; }
  .role { color: #0ff; font-size: 14px; margin-bottom: 25px; font-weight: bold; letter-spacing: 1px; }
  
  .stats { color: #ccc; font-size: 13px; line-height: 2; margin-bottom: 30px; }
  .stat-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #333; padding-bottom: 6px; margin-bottom: 10px; }
  .stat-label { color: #00ff41; }
  
  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .skill-btn { background: rgba(0,255,65,0.1); border: 1px solid #0ff; color: #0ff; padding: 10px; text-align: center; font-size: 13px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
  .skill-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 15px #0ff; font-weight: bold; }
  
  .back-btn { position: absolute; top: 30px; right: 30px; color: #00ff41; text-decoration: none; border: 1px solid #00ff41; padding: 10px 20px; background: rgba(0,0,0,0.8); transition: 0.3s; pointer-events: auto; font-size: 14px; z-index: 20; }
  .back-btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }
</style>
</head>
<body>

<three-d-stage name="nexus-core" background="#020202" autorotate></three-d-stage>
<a href="index.html" class="back-btn">< BACK TO HUB</a>

<div class="overlay">
  <div class="bio-panel">
    <h1>[N I C K N A M E]</h1>
    <div class="role">SYS_ADMIN // CYBER_OPERATIVE</div>
    <div class="stats">
      <div class="stat-row"><span class="stat-label">STATUS</span><span style="color:#0f0">ONLINE</span></div>
      <div class="stat-row"><span class="stat-label">THREAT_LEVEL</span><span style="color:#f00">CRITICAL</span></div>
      <div class="stat-row"><span class="stat-label">UPTIME</span><span>99.999%</span></div>
      <div class="stat-row"><span class="stat-label">FACTION</span><span>ELITE HACKER</span></div>
      <div class="stat-row"><span class="stat-label">LOCATION</span><span>UNKNOWN_PROXY</span></div>
    </div>
    <div class="skills-grid">
      <div class="skill-btn">C++ / RUST</div>
      <div class="skill-btn">LINUX KERNEL</div>
      <div class="skill-btn">REVERSE_ENG</div>
      <div class="skill-btn">EXPLOIT_DEV</div>
    </div>
  </div>
</div>

<script src="three-d-stage.js"></script>
<script type="module">
  const stage = document.querySelector('three-d-stage');
  const { THREE } = await stage.ready;
  const model = new THREE.Group();

  // 1. Central Core (Icosahedron Wireframe)
  const coreGeo = new THREE.IcosahedronGeometry(1.5, 1);
  const coreMat = new THREE.MeshStandardMaterial({ 
    color: 0x00ff41, 
    emissive: 0x004411,
    roughness: 0.1, 
    metalness: 0.8,
    wireframe: true
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.name = 'nexus_core';
  model.add(core);

  // 2. Inner Solid Core
  const solidGeo = new THREE.IcosahedronGeometry(1.0, 0);
  const solidMat = new THREE.MeshStandardMaterial({
    color: 0x000000,
    emissive: 0x001100,
    roughness: 0.5,
    metalness: 0.9
  });
  const solidCore = new THREE.Mesh(solidGeo, solidMat);
  solidCore.name = 'nexus_inner';
  model.add(solidCore);

  // 3. Data Rings
  const ring1Geo = new THREE.TorusGeometry(3.0, 0.02, 16, 100);
  const ringMatCyan = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444, metalness: 0.6 });
  const ring1 = new THREE.Mesh(ring1Geo, ringMatCyan);
  ring1.name = 'data_ring_cyan';
  ring1.rotation.x = Math.PI / 3;
  model.add(ring1);

  const ring2Geo = new THREE.TorusGeometry(4.0, 0.04, 16, 100);
  const ringMatPink = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0x440044, metalness: 0.6 });
  const ring2 = new THREE.Mesh(ring2Geo, ringMatPink);
  ring2.name = 'data_ring_pink';
  ring2.rotation.y = Math.PI / 4;
  model.add(ring2);

  // 4. Floating Data Nodes
  const nodeGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
  const nodeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x222222, metalness: 0.8, roughness: 0.1 });
  
  for(let i=0; i<10; i++) {
    const node = new THREE.Mesh(nodeGeo, nodeMat);
    node.name = 'data_block_' + i;
    const angle = (i / 10) * Math.PI * 2;
    node.position.set(Math.cos(angle) * 4.0, Math.sin(angle*3) * 1.5, Math.sin(angle) * 4.0);
    node.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
    ring2.add(node);
  }
  
  stage.setObject(model);

  // Animation Loop
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.005;
    core.rotation.y = time;
    core.rotation.x = time * 0.7;
    solidCore.rotation.y = -time * 1.2;
    ring1.rotation.z = -time * 1.5;
    ring2.rotation.z = time * 0.8;
  }
  animate();

</script>
</body>
</html>
