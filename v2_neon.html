<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NODE_02 // CYBER_HUD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Rajdhani', sans-serif; background: #0a0a1a; color: #0ff; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background-image: radial-gradient(circle at center, #1a0a2a 0%, #0a0a1a 100%); }
  
  /* Scanlines */
  body::before { content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; z-index: 50; pointer-events: none; }
  
  .hud-container { position: relative; width: 90%; max-width: 800px; background: rgba(0, 20, 40, 0.6); padding: 2px; clip-path: polygon(0 20px, 20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); z-index: 10; }
  .hud-inner { background: rgba(5, 10, 20, 0.9); padding: 40px; clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); border: 1px solid #0ff; box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.2); }
  
  .header { display: flex; justify-content: space-between; border-bottom: 2px solid #f0f; padding-bottom: 10px; margin-bottom: 30px; text-shadow: 0 0 5px #f0f; color: #f0f; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
  
  .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
  @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  
  .avatar-box { position: relative; }
  .avatar-box::after { content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; border: 1px solid #0ff; z-index: -1; animation: pulse 2s infinite; }
  .avatar { width: 100%; border: 2px solid #0ff; filter: contrast(120%) hue-rotate(180deg); display: block; }
  
  .info h1 { font-size: 2.5rem; color: #fff; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; margin-bottom: 10px; text-transform: uppercase; }
  .info p { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.5; color: #bbf; }
  
  .stats { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
  .stat { display: flex; align-items: center; justify-content: space-between; font-size: 1.1rem; }
  .stat-bar { height: 10px; flex-grow: 1; background: #022; margin-left: 15px; position: relative; }
  .stat-fill { position: absolute; top: 0; left: 0; height: 100%; background: #f0f; box-shadow: 0 0 10px #f0f; }
  
  .actions { display: flex; gap: 15px; }
  .btn { flex: 1; padding: 12px; background: transparent; color: #0ff; border: 1px solid #0ff; text-align: center; text-decoration: none; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; transition: 0.2s; position: relative; overflow: hidden; }
  .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: #0ff; transition: 0.2s; z-index: -1; }
  .btn:hover::before { left: 0; }
  .btn:hover { color: #000; text-shadow: none; box-shadow: 0 0 15px #0ff; }
  .btn-alt { border-color: #f0f; color: #f0f; }
  .btn-alt::before { background: #f0f; }
  .btn-alt:hover { color: #000; box-shadow: 0 0 15px #f0f; }

  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .back-btn { position: absolute; top: 20px; left: 20px; color: #0ff; text-decoration: none; border: 1px solid #0ff; padding: 5px 10px; font-weight: bold; z-index: 100; background: rgba(0,0,0,0.5); }
  .back-btn:hover { background: #0ff; color: #000; }
</style>
</head>
<body>
<a href="index.html" class="back-btn">< BACK</a>
<div class="hud-container">
  <div class="hud-inner">
    <div class="header">
      <span>NETRUNNER_ID: 8991</span>
      <span>STATUS: ONLINE</span>
    </div>
    <div class="grid">
      <div class="avatar-box">
        <img src="https://i.pravatar.cc/400?img=12" alt="Avatar" class="avatar">
      </div>
      <div class="info">
        <h1>NightCity_Ghost</h1>
        <p>Specialist in corp-data extraction and cyber-warfare. High-tier ICE breaker.</p>
        
        <div class="stats">
          <div class="stat"><span>INTEL</span><div class="stat-bar"><div class="stat-fill" style="width: 95%;"></div></div></div>
          <div class="stat"><span>STEALTH</span><div class="stat-bar"><div class="stat-fill" style="width: 80%; background: #0ff; box-shadow: 0 0 10px #0ff;"></div></div></div>
          <div class="stat"><span>COMBAT</span><div class="stat-bar"><div class="stat-fill" style="width: 60%; background: #ff0; box-shadow: 0 0 10px #ff0;"></div></div></div>
        </div>

        <div class="actions">
          <a href="https://github.com" class="btn">PORTFOLIO</a>
          <a href="mailto:ghost@net.com" class="btn btn-alt">CONTRACT</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
